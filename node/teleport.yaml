version: v3
teleport:
  nodename: server-1
  data_dir: /var/lib/teleport

  auth_token: node-token
  proxy_server: beast:443

ssh_service:
  enabled: "yes"
  listen_addr: 0.0.0.0:3022
  commands:
    - name: hostname
      command: [ echo, "instance-1" ]
      period: 1m0s

auth_service:
  enabled: no
proxy_service:
  enabled: no
app_service:
  enabled: no
