version: v3
teleport:
  nodename: teleport

access_graph:
  enabled: true
  endpoint: access-graph:50051
  ca: /etc/access-graph/keys/ca.crt

auth_service:
  enabled: yes
  listen_addr: 0.0.0.0:3025
  cluster_name: teleport
  license_file: /app/e/fixtures/license-test.pem
  session_recording: node
  tokens:
    - "node:node-token"
    - "app,node:app-token"
    - "proxy,node:proxy-token"
    - "kube:kube-token"
  authentication:
    type: local
    second_factor: on
    webauthn:
      rp_id: beast
    connector_name: passwordless

app_service:
  debug_app: true
  enabled: yes
  apps:
    - name: "grafana-production"
      uri: "http://localhost:3000"
      public_addr: "grafana.beast"
      labels:
        env: production
        app: grafana
        region: eu-west-1
        family: eks
    - name: "grafana-staging"
      uri: "http://localhost:3000"
      public_addr: "grafana-staging.beast"
      labels:
        env: staging
        app: grafana
        region: eu-west-2
        family: eks
    - name: "jenkins-production"
      uri: "http://localhost:3000"
      public_addr: "jenkins.beast"
      labels:
        env: production
        app: jenkins
        region: eu-west-1
